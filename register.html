<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account – QuizHub</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html">Quiz<span>Hub</span></a>
    </div>
  </header>
  <main class="container">
    <div class="card form-card">
      <h1>Create your account</h1>
      <p class="sub">Join QuizHub to take and create quizzes.</p>
      <div id="message"></div>
      <form id="registerForm">
        <div class="field"><label for="name">Display name</label>
          <input id="name" type="text" autocomplete="name" required></div>
        <div class="field"><label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="password">Password (6+ characters)</label>
          <input id="password" type="password" autocomplete="new-password" required></div>
        <div class="field"><label for="confirm">Confirm password</label>
          <input id="confirm" type="password" autocomplete="new-password" required></div>
        <button class="btn btn-primary" id="submitBtn" type="submit">Create account</button>
      </form>
      <p class="form-foot">Already registered? <a href="login.html">Log in</a></p>
    </div>
  </main>
  <script type="module" src="js/register.js"></script>
</body>
</html>
