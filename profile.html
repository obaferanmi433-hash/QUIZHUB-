<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My profile – QuizHub</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/forms.css">
  <style>
    .field textarea{width:100%;padding:12px 14px;border:1px solid var(--border);
      border-radius:12px;font-size:1rem;font-family:inherit;min-height:110px;resize:vertical}
    .field textarea:focus{outline:2px solid var(--blue);border-color:transparent}
    .count{font-size:.85rem;color:var(--muted);text-align:right}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html">Quiz<span>Hub</span></a>
    </div>
  </header>
  <main class="container">
    <div class="card form-card">
      <p class="sub" id="status">Checking your login...</p>
      <div id="content" style="display:none">
        <h1>My profile</h1>
        <p class="sub" id="email"></p>
        <div id="message"></div>
        <form id="profileForm">
          <div class="field"><label for="displayName">Display name</label>
            <input id="displayName" type="text" maxlength="50" required></div>
          <div class="field"><label for="bio">Short bio</label>
            <textarea id="bio" maxlength="300" placeholder="Tell others a little about you"></textarea>
            <div class="count"><span id="bioCount">0</span>/300</div></div>
          <button class="btn btn-primary" id="saveBtn" type="submit">Save changes</button>
        </form>
        <p class="form-foot"><a href="dashboard.html">Back to dashboard</a></p>
      </div>
    </div>
  </main>
  <script type="module" src="js/profile-page.js"></script>
</body>
</html>
